version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: product-catalog-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - FAKESTORE_API_BASE_URL=https://fakestoreapi.com
      - SALES_EMAIL=sales@productcatalog.local
      - EMAIL_PROVIDER=console
      - CACHE_TTL_SECONDS=300
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
